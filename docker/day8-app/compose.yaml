services:
  day8-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-stage
      args:
        BUILD_VERSION: local
        BUILD_COMMIT: local
        BUILD_DATE: local
    image: raj358822/day8-node-app:local
    container_name: day8-node-app
    restart: unless-stopped

    ports:
      - "8088:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: local

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100

    mem_limit: 256m
    cpus: 0.50

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3