services:
  day9-app:
    build:
      context: .
      target: runtime-stage
      args:
        BUILD_VERSION: local
        BUILD_COMMIT: local
        BUILD_DATE: local
    image: raj358822/day9-ecs-app:local
    ports: ["8089:3000"]
    environment:
      NODE_ENV: production
      APP_VERSION: local
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
